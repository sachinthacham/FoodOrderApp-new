services:
  # 1. .NET Backend API
  backend:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: foodorder-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ConnectionStrings__DefaultConnection=Server=host.docker.internal;Database=FoodOrder;Trusted_Connection=true;MultipleActiveResultSets=true;TrustServerCertificate=true;
    ports:
      - "5000:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # 2. React Frontend
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: foodorder-ui
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped