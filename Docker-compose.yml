version: '3.8'

services:
  # 1. SQL Server Database
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: foodorder  
    environment:
      SA_PASSWORD: "FoodOrder@123456!" 
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sql-data:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P $$SA_PASSWORD -Q 'SELECT 1' || exit 1"]
      interval: 15s
      retries: 10
      start_period: 60s
      timeout: 10s

  # 2. .NET Backend API
  backend:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: foodorder-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=FoodOrder;User Id=sa;Password=FoodOrder@123456!;TrustServerCertificate=true;MultipleActiveResultSets=true;
    ports:
      - "5000:80"
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped

  # 3. React Frontend
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: foodorder-ui
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sql-data: